    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var pathAndQuery = decoded.split('?');
          var path = pathAndQuery[0] || '/';
          var query = pathAndQuery.length > 1 ? '?' + pathAndQuery.slice(1).join('?') : '';
          window.history.replaceState(null, null, path + query + l.hash);
        } else {
          var pathSegmentsToKeep = 0;
          var staticFiles = ['sitemap.xml', 'robots.txt', 'favicon.ico', 'favicon.svg'];
          var pathname = l.pathname.toLowerCase();
          var isStaticFile = staticFiles.some(function(file) {
            return pathname.endsWith('/' + file) || pathname === '/' + file;
          });
          
          if (!isStaticFile && l.pathname !== '/') {
            var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).filter(function(p) { return p; });
            if (path.length > 0) {
              var newPath = '/' + path.join('/').replace(/&/g, '~and~');
              var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
              var hash = l.hash || '';
              window.history.replaceState(null, null, '/?/' + newPath.slice(1) + query + hash);
              l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' + newPath.slice(1) + query + hash);
            }
          }
        }
      }(window.location))
    </script>
